name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: springboot-demo
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build-and-scan:
    name: Build, Test & SonarQube Scan
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.11-eclipse-temurin-17
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/api/system/status || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      SONAR_HOST_URL: "http://sonarqube:9000"
      #options: --user 1001:1001
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for SonarQube & generate dynamic token
        working-directory: springboot/demo
        run: |
          echo "Waiting for the dynamic SonarQube container to finish initializing..."
          until curl -s "$SONAR_HOST_URL/api/system/status" | grep -q '"status":"UP"'; do
            echo "SonarQube is still loading... sleeping 10s"
            sleep 10
          done
          echo "✅ SonarQube Server is completely UP!"

          echo "Generating a dynamic pipeline token via Web API..."
          TOKEN_RESPONSE=$(curl -s -u admin:admin -X POST \
            "$SONAR_HOST_URL/api/user_tokens/generate?name=pipeline&type=GLOBAL_ANALYSIS_TOKEN")

          DYNAMIC_SONAR_TOKEN=$(echo "$TOKEN_RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$DYNAMIC_SONAR_TOKEN" ]; then
            echo "❌ ERROR: Failed to generate a dynamic token! API Response was: $TOKEN_RESPONSE"
            exit 1
          fi
          echo "✅ Dynamic token generated successfully."
          echo "DYNAMIC_SONAR_TOKEN=$DYNAMIC_SONAR_TOKEN" >> "$GITHUB_ENV"

      - name: Build (skip tests)
        working-directory: springboot/demo
        run: mvn clean verify -DskipTests=true

      - name: SonarQube Scan
        working-directory: springboot/demo
        env:
          #SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
          -Dsonar.projectName=springboot-demo \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$DYNAMIC_SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=300
          echo "Waiting for Quality Gate..."
          sleep 10
          STATUS=$(curl -s -u $SONAR_TOKEN: \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=springboot-demo" \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Quality Gate Status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate FAILED"
            exit 1
          fi
          echo "Quality Gate PASSED"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: springboot/demo/target/demo-1.0-SNAPSHOT.jar
          retention-days: 1

  docker-build-push:
    name: Docker Build, Trivy Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: springboot/demo/target

      - name: Docker Build
        working-directory: springboot/demo
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          cache-dir: /tmp/trivy-cache

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Tag & Push Image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Docker Logout
        if: always()
        run: docker logout
