name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: springboot-demo
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build-and-scan:
    name: Build, Test & SonarQube Scan
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.11-eclipse-temurin-17
      #options: --user 1001:1001
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & SonarQube Scan
        working-directory: springboot-POC/springboot/demo
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.697:sonar \
            -Dsonar.projectKey=springboot-demo \
            -Dsonar.projectName=springboot-demo \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}

          echo "Waiting for Quality Gate..."
          sleep 10
          STATUS=$(curl -s -u $SONAR_TOKEN: \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=springboot-demo" \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Quality Gate Status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate FAILED"
            exit 1
          fi
          echo "Quality Gate PASSED"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: springboot/demo/target/demo-1.0-SNAPSHOT.jar
          retention-days: 1

  docker-build-push:
    name: Docker Build, Trivy Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: springboot/demo/target

      - name: Docker Build
        working-directory: springboot/demo
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          cache-dir: /tmp/trivy-cache

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Tag & Push Image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Docker Logout
        if: always()
        run: docker logout
